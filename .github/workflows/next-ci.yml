name: Project Standard

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      run-audit:
        type: boolean
        default: true
      audit-blocking:
        type: boolean
        default: false
      require-lint:
        type: boolean
        default: true
      require-build:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "name=npm" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found. Commit package-lock.json or pnpm-lock.yaml." >&2
            exit 1
          fi

      - name: Setup pnpm
        if: ${{ steps.package-manager.outputs.name == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.package-manager.outputs.name }}

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        if: ${{ inputs.require-lint }}
        run: ${{ steps.package-manager.outputs.name }} run lint --if-present

      - name: Typecheck
        shell: bash
        run: |
          ${{ steps.package-manager.outputs.name }} run typecheck --if-present
          ${{ steps.package-manager.outputs.name }} run type-check --if-present

      - name: Test
        run: ${{ steps.package-manager.outputs.name }} run test --if-present

      - name: Build
        if: ${{ inputs.require-build }}
        run: ${{ steps.package-manager.outputs.name }} run build

      - name: Dependency audit (blocking)
        if: ${{ inputs.run-audit && inputs.audit-blocking }}
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi

      - name: Dependency audit (report only)
        if: ${{ inputs.run-audit && !inputs.audit-blocking }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi
