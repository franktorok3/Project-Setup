name: Project Standard

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      run-audit:
        type: boolean
        default: true
      audit-blocking:
        type: boolean
        default: false
      require-lint:
        type: boolean
        default: true
      require-build:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            version=$(node -p "((require('./package.json').packageManager || 'pnpm@10.6.2').match(/^pnpm@([^+]+)/) || [,'10.6.2'])[1]")
            echo "pnpm-version=$version" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "name=npm" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found. Commit package-lock.json or pnpm-lock.yaml." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm with Corepack
        if: ${{ steps.package-manager.outputs.name == 'pnpm' }}
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${{ steps.package-manager.outputs.pnpm-version }}" --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        if: ${{ inputs.require-lint }}
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if (!p.scripts?.lint) { console.error("Required lint script is missing"); process.exit(1); }'
          ${{ steps.package-manager.outputs.name }} run lint

      - name: Typecheck
        shell: bash
        run: |
          for script in typecheck type-check; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.['${script}'] ? 0 : 1)"; then
              ${{ steps.package-manager.outputs.name }} run "$script"
            fi
          done

      - name: Test
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test ? 0 : 1)'; then
            ${{ steps.package-manager.outputs.name }} run test
          fi

      - name: Build
        if: ${{ inputs.require-build }}
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if (!p.scripts?.build) { console.error("Required build script is missing"); process.exit(1); }'
          ${{ steps.package-manager.outputs.name }} run build

      - name: Dependency audit (blocking)
        if: ${{ inputs.run-audit && inputs.audit-blocking }}
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi

      - name: Dependency audit (report only)
        if: ${{ inputs.run-audit && !inputs.audit-blocking }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi
