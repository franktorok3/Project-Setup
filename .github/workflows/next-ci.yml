name: Project Standard

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      run-audit:
        type: boolean
        default: true
      audit-blocking:
        type: boolean
        default: false
      require-lint:
        type: boolean
        default: true
      require-build:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            version=$(node -p "((require('./package.json').packageManager || 'pnpm@10.6.2').match(/^pnpm@([^+]+)/) || [,'10.6.2'])[1]")
            echo "pnpm-version=$version" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "name=npm" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found. Commit package-lock.json or pnpm-lock.yaml." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm with Corepack
        if: ${{ steps.package-manager.outputs.name == 'pnpm' }}
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${{ steps.package-manager.outputs.pnpm-version }}" --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Verify optional Astryx design profile
        shell: bash
        run: |
          design_system=$(sed -n '/^[[:space:]]*design:[[:space:]]*$/,/^[^[:space:]]/s/^[[:space:]]*system:[[:space:]]*//p' frank-stack.yml | head -1 | tr -d "\"'")
          if [[ -z "$design_system" || "$design_system" == "custom" || "$design_system" == "none" ]]; then
            exit 0
          fi
          if [[ "$design_system" != "astryx" ]]; then
            echo "Unsupported design.system: $design_system. Use astryx, custom, or none." >&2
            exit 1
          fi
          design_version=$(sed -n '/^[[:space:]]*design:[[:space:]]*$/,/^[^[:space:]]/s/^[[:space:]]*version:[[:space:]]*//p' frank-stack.yml | head -1 | tr -d "\"'")
          DESIGN_VERSION="$design_version" node <<'NODE'
          const manifest = require('./package.json');
          const all = {...manifest.dependencies, ...manifest.devDependencies};
          const expected = process.env.DESIGN_VERSION ?? '';
          if (!/^\d+\.\d+\.\d+$/.test(expected)) {
            console.error('Astryx profile requires an exact design.version');
            process.exitCode = 1;
          }
          const required = ['@astryxdesign/core', '@astryxdesign/cli'];
          for (const name of required) {
            if (!all[name]) {
              console.error(`Astryx profile requires ${name}`);
              process.exitCode = 1;
            } else if (all[name] !== expected) {
              console.error(`${name} must be pinned to ${expected}; found ${all[name]}`);
              process.exitCode = 1;
            }
          }
          const themes = Object.keys(all).filter((name) => name.startsWith('@astryxdesign/theme-'));
          if (!themes.length) {
            console.error('Astryx profile requires an @astryxdesign/theme-* package');
            process.exitCode = 1;
          }
          for (const name of themes) {
            if (all[name] !== expected) {
              console.error(`${name} must be pinned to ${expected}; found ${all[name]}`);
              process.exitCode = 1;
            }
          }
          if (!all['@stylexjs/stylex'] || !/^0\.19\.\d+$/.test(all['@stylexjs/stylex'])) {
            console.error('Astryx profile requires a pinned @stylexjs/stylex 0.19.x dependency');
            process.exitCode = 1;
          }
          for (const name of ['react', 'react-dom']) {
            const major = Number((all[name] ?? '').match(/\d+/)?.[0] ?? 0);
            if (major < 19) {
              console.error(`Astryx profile requires ${name} 19 or newer`);
              process.exitCode = 1;
            }
          }
          if (!manifest.scripts?.astryx) {
            console.error('Astryx profile requires an "astryx" package script');
            process.exitCode = 1;
          }
          NODE
          ${{ steps.package-manager.outputs.name }} run astryx -- doctor --json

      - name: Lint
        if: ${{ inputs.require-lint }}
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if (!p.scripts?.lint) { console.error("Required lint script is missing"); process.exit(1); }'
          ${{ steps.package-manager.outputs.name }} run lint

      - name: Typecheck
        shell: bash
        run: |
          for script in typecheck type-check; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.['${script}'] ? 0 : 1)"; then
              ${{ steps.package-manager.outputs.name }} run "$script"
            fi
          done

      - name: Test
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test ? 0 : 1)'; then
            ${{ steps.package-manager.outputs.name }} run test
          fi

      - name: Build
        if: ${{ inputs.require-build }}
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if (!p.scripts?.build) { console.error("Required build script is missing"); process.exit(1); }'
          ${{ steps.package-manager.outputs.name }} run build

      - name: Dependency audit (blocking)
        if: ${{ inputs.run-audit && inputs.audit-blocking }}
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi

      - name: Dependency audit (report only)
        if: ${{ inputs.run-audit && !inputs.audit-blocking }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ steps.package-manager.outputs.name }}" == "pnpm" ]]; then
            pnpm audit --audit-level=high
          else
            npm audit --audit-level=high
          fi
