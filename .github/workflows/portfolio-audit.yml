name: Portfolio Compliance Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects.yml
      - scripts/audit-portfolio.mjs
      - .github/workflows/portfolio-audit.yml
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout standards repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit registered repositories
        id: portfolio
        continue-on-error: true
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-portfolio.mjs

      - name: Publish current report issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list --state open --search 'Portfolio Compliance Report in:title' --json number --jq '.[0].number')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file artifacts/portfolio-compliance.md
          else
            gh issue create --title 'Portfolio Compliance Report' --body-file artifacts/portfolio-compliance.md
          fi

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-compliance
          path: artifacts/portfolio-compliance.md
          retention-days: 30

      - name: Enforce portfolio compliance
        if: always() && steps.portfolio.outcome != 'success'
        run: |
          echo "Portfolio compliance failed. Review the published report."
          exit 1
