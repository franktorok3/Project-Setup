name: Standards CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate required standards files
        run: |
          test -f STACK_STANDARD.md
          test -f RULESETS.md
          test -f projects.yml
          test -f .github/workflows/next-ci.yml
          test -f scripts/audit-portfolio.mjs
          test -f scripts/check-postgres-standard.mjs
          test -f scripts/test-postgres-standard.mjs
          test -f templates/prisma-postgres/ci-caller.yml
          test -f templates/prisma-postgres/frank-stack.yml
          test -f templates/prisma-postgres/integration-proof.mjs
      - name: Validate auditor syntax
        run: node --check scripts/audit-portfolio.mjs
      - name: Validate manifest checker syntax
        run: node --check scripts/check-manifest.mjs
      - name: Validate conditional PostgreSQL standard
        run: node scripts/check-postgres-standard.mjs
      - name: Test PostgreSQL proof contract
        run: node scripts/test-postgres-standard.mjs
